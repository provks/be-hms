<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In - Healthcare Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <!-- Navbar section -->
    <nav class="navbar navbar-expand-lg navbar-light bg-info-subtle">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Healthcare System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="adminDashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="adminRegister.html">Admin Register</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Sign In Form -->
    <section class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm border-info-subtle">
                    <h4 class="card-header text-center bg-info-subtle">
                        Sign In
                    </h4>
                    <div class="card-body p-5">
                        <form id="signinForm">
                            <div class="mb-3">
                                <label for="signinEmail" class="form-label"><strong>Email address</strong></label>
                                <input type="email" class="form-control" id="signinEmail" aria-describedby="emailHelp" placeholder="Enter your email" required>
                                <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
                            </div>
                            <div class="mb-3">
                                <label for="signinPassword" class="form-label"><strong>Password</strong></label>
                                <input type="password" class="form-control" id="signinPassword" placeholder="Enter your password" required>
                            </div>
                            <!-- <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="signinCheck1">
                                <label class="form-check-label" for="signinCheck1">Check me out</label>
                            </div> -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-info fw-bold">Sign In</button>
                            </div>
                            <div class="text-center mt-3">
                                <p class="mb-0">Don't have an account? <a href="signup.html">Sign up</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

    <script>
        document.getElementById('getOTPBtn').addEventListener('click', async function () {
            const email = document.getElementById('email').value;
            if (!email) {
                alert('Please enter a valid email');
                return;
            }

            // Disable the Get OTP button after it's clicked
            document.getElementById('getOTPBtn').disabled = true;

            // Make a request to the backend to send the OTP to the provided email
            try {
                const response = await fetch("http://localhost:5000/api/adminauth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('OTP sent to your email!');
                    // Enable the Login Code input and Submit button
                    document.getElementById('loginCode').disabled = false;
                    document.getElementById('submitBtn').disabled = false;
                } else {
                    alert(data.error || "Something went wrong!");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("There was an error while sending the OTP.");
            }
        });

        document.getElementById('adminLoginForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const loginCode = document.getElementById('loginCode').value;

            // Send the email and OTP for verification
            try {
                const response = await fetch("http://localhost:5000/api/adminauth/verify-otp", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, otp: loginCode })
                });

                const data = await response.json();

                if (response.ok) {
                    console.log(data)
                    alert('Login successful');
                    // Store the token in the session storage
                    sessionStorage.setItem("token", data.token);
                    window.location.href = "admin-dashboard/admindashboard.html"; // Redirect to the admin dashboard
                } else {
                    alert(data.error || "Invalid OTP");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("There was an error during the verification.");
            }
        });
    </script>
  </body>
</html>
