                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">

            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">

                        <a class="nav-link" href="#">Dashboard</a>

            <form class="d-flex" role="search">

    <!-- Booking Appointment Section -->
    <section class="container py-5">
        <div class="row justify-content-center">
            <!-- Booking Appointment form -->
            <div class="col-md-8">
                <div class="card shadow-sm border-info-subtle">
                    <h4 class="card-header text-center bg-info-subtle">
                        Book An Appointment
                    </h4>
                    <div class="card-body p-4">
                        <form id="editProfileForm">
                            <div class="mb-2">
                                <label for="name" class="form-label"><strong>Full Name</strong></label>
                                <input type="text" class="form-control" id="name" aria-describedby="nameHelp" placeholder="Enter your full name" required>
                            </div>
                            <div class="mb-2">
                                <label for="email" class="form-label"><strong>Email address</strong></label>
                                <input type="email" class="form-control" id="email" aria-describedby="emailHelp" placeholder="Enter your email" required>
                            </div>
                            <div class="mb-2">
                                <label for="phone" class="form-label"><strong>Phone Number</strong></label>
                                <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number" required>
                            </div>
                            <div class="mb-2">
                                <label for="dob" class="form-label"><strong>Date of Birth</strong></label>
                                <input type="date" class="form-control" id="dob" required>
                            </div>
                            <div class="mb-2">
                                <label for="editAddress" class="form-label"><strong>Address</strong></label>
                                <textarea class="form-control" id="editAddress" rows="3" placeholder="Enter your address" required></textarea>
                            </div>
                            <div class="mb-2">
                                <label for="editAddress" class="form-label"><strong>Select Doctor</strong></label>
                                <select class="form-control" id="editAddress" rows="3" placeholder="Enter your address"
                                    required>
                                    <option value="">Select a doctor</option>
                                    <option value="doctor1">Dr. Neelam Sonkar - Gynae</option>
                                    <option value="doctor2">Dr. Gagan - Cardiologist</option>
                                    <option value="doctor3">Dr. Saim Hashmi - Dermatologist</option>  
                                    <option value="doctor3">Dr. Prasum Nandi - Neurologist</option>  
                                </select>
                            </div>
                            <div class="mb-2">
                                <label for="editAddress" class="form-label"><strong>Reason for Visit</strong></label>
                                <textarea class="form-control" id="editAddress" rows="3" placeholder="Enter the brief reason for your visit"
                                    required></textarea>
                            </div>
                            <div class="d-grid gap-2 mt-3">
                                <button type="submit" class="btn btn-info fw-bold">Confirm Book Appointment</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
